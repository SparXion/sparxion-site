<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396">
  <!-- LinkedIn Banner Template -->
  <!-- Recommended dimensions: 1584 x 396 px (4:1 aspect ratio) -->
  <!-- Minimum: 1192 x 220 px | Max file size: 8MB -->
  
  <defs>
    <style>
      .safe-zone { fill: none; stroke: #0077b5; stroke-width: 2; stroke-dasharray: 8 4; opacity: 0.5; }
      .guide-text { font-family: Arial, sans-serif; font-size: 14px; fill: #666; }
      .title-text { font-family: Arial, sans-serif; font-size: 24px; font-weight: bold; fill: #333; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="1584" height="396" fill="#f3f2ef"/>
  
  <!-- Safe Zone Guides (content should stay within these areas) -->
  <!-- Left/Right margins: ~72px (content safe area) -->
  <rect x="72" y="0" width="1440" height="396" class="safe-zone"/>
  
  <!-- Center content area -->
  <rect x="72" y="50" width="1440" height="296" class="safe-zone"/>
  
  <!-- Guide Labels -->
  <text x="80" y="30" class="guide-text">Safe Zone (72px margins)</text>
  <text x="80" y="380" class="guide-text">LinkedIn Banner: 1584 x 396 px</text>
  
  <!-- Center Title Area -->
  <text x="792" y="200" class="title-text" text-anchor="middle">Your Content Here</text>
  
  <!-- Grid Guides (optional, remove before final export) -->
  <g opacity="0.2">
    <!-- Vertical thirds -->
    <line x1="528" y1="0" x2="528" y2="396" stroke="#999" stroke-width="1"/>
    <line x1="1056" y1="0" x2="1056" y2="396" stroke="#999" stroke-width="1"/>
    <!-- Horizontal center -->
    <line x1="0" y1="198" x2="1584" y2="198" stroke="#999" stroke-width="1"/>
  </g>
</svg>
